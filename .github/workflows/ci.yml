name: OpenWeather API CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - 2026

jobs:
  validate-build-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Validate OpenAPI Specification
        run: npx @redocly/cli lint openapi/openweather-api.yaml

      - name: Run Spectral Linting
        run: npm run lint:openapi

      - name: Run Unit Tests
        run: npm test

      - name: Build Application
        run: npm run build